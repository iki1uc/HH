<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HH – Host Hub Stargate + Ghost L2</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:20px;
    overflow:hidden;
}

/* Stargate */
#gate {
    position:absolute;
    right:0;
    top:0;
    width:50vw;
    height:100vh;
    border-left:4px solid #0ff;
    background:radial-gradient(circle at center, #444, #000);
    animation:spinGate 12s linear infinite;
}
@keyframes spinGate { from {transform:rotate(0deg);} to {transform:rotate(360deg);} }

#vortex {
    position:absolute;
    right:0;
    top:0;
    width:50vw;
    height:100vh;
    background:conic-gradient(from 180deg, #0ff, #000);
    opacity:0.35;
    animation:vortexSpin 5s linear infinite;
}
@keyframes vortexSpin { from {transform:rotate(0deg);} to {transform:rotate(-360deg);} }

#halo {
    position:absolute;
    right:0;
    top:8vh;
    width:50vw;
    height:12vh;
    background:radial-gradient(circle, rgba(255,255,255,0.5), transparent);
}

/* Effekt */
.effLine {
    width:100%;
    height:4px;
    background:linear-gradient(90deg,#0ff,#000);
}
</style>
</head>
<body>

<div id="gate"></div>
<div id="vortex"></div>
<div id="halo"></div>

</body>
</html>
