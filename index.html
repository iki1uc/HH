<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HVGNH · MasterIndex</title>

<style>
body {
    background:#0d0d0d;
    color:#e6e6e6;
    font-family:Arial;
    margin:0;
    padding:0;
}
header {
    background:#111;
    padding:25px;
    border-bottom:2px solid #4af;
    text-align:center;
}
header h1 {
    font-size:34px;
    color:#4af;
}
.whirl {
    font-size:52px;
    animation:spin 6s linear infinite;
}
@keyframes spin {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
}
.panel {
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    padding:20px;
    margin:25px;
}
pre {
    background:#000;
    padding:15px;
    border-radius:8px;
    border:1px solid #333;
}
button {
    background:#222;
    color:#fff;
    border:1px solid #555;
    padding:10px 20px;
    cursor:pointer;
}
button:hover {
    background:#333;
}
</style>
</head>

<body>

<header>
    <h1>HVGNH · MasterIndex</h1>
    <div class="whirl">🌀</div>
</header>

<div class="panel">
    <h2>RenderEngine</h2>
    <pre id="renderOut">Bereit…</pre>
    <button onclick="runRender()">Render</button>
</div>

<div class="panel">
    <h2>OrbitSystem</h2>
    <pre id="orbitOut">Bereit…</pre>
    <button onclick="runOrbit()">Orbit</button>
</div>

<div class="panel">
    <h2>UniverseCore</h2>
    <pre id="universeOut">Bereit…</pre>
    <button onclick="runUniverse()">Universe</button>
</div>

<div class="panel">
    <h2>Pipeline12</h2>
    <pre id="pipeOut">Bereit…</pre>
    <button onclick="runPipe()">Pipeline</button>
</div>

<script src="HVGNH_RenderEngine.js"></script>
<script src="HVGNH_OrbitSystem.js"></script>
<script src="HVGNH_UniverseCore.js"></script>
<script src="HVGNH_Pipeline12.js"></script>

<script>
const p = { x: 1.2, y: 0.8, z: 2.4 };

function runRender() {
    HVGNH_RenderEngine.tick();
    document.getElementById("renderOut").innerText =
        JSON.stringify(HVGNH_RenderEngine.render(p), null, 4);
}

function runOrbit() {
    document.getElementById("orbitOut").innerText =
        JSON.stringify(HVGNH_OrbitSystem.compute(p, HVGNH_RenderEngine.time), null, 4);
}

function runUniverse() {
    document.getElementById("universeOut").innerText =
        JSON.stringify(HVGNH_UniverseCore.field(p, HVGNH_RenderEngine.time), null, 4);
}

function runPipe() {
    document.getElementById("pipeOut").innerText =
        JSON.stringify(HVGNH_Pipeline12.flow(p, HVGNH_RenderEngine.time), null, 4);
}
</script>

</body>
</html>
