<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HH · Orbit‑Atom‑Core · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:30px; }
h1 { color:#6cf; margin-bottom:20px; }
canvas { background:#111; border:1px solid #0f0; display:block; margin-top:20px; }
</style>
</head>

<body>

<h1>HH · 360° · Atom‑Orbit</h1>
<canvas id="hhCanvas" width="600" height="400"></canvas>

<script>
// ------------------------------------------------------
// HH ORBIT SYSTEM – FINAL VERSION
// ------------------------------------------------------

const c = document.getElementById("hhCanvas");
const x = c.getContext("2d");

let t = 0;

// Atom‑Orbit‑Parameter
const atoms = [
  { r: 80, speed: 0.03, color: "#0ff" },
  { r: 120, speed: 0.02, color: "#f0f" },
  { r: 160, speed: 0.015, color: "#ff0" }
];

function renderHH(){
  x.clearRect(0,0,c.width,c.height);

  const cx = c.width/2;
  const cy = c.height/2;

  // ------------------------------------------------------
  // 1. HH ROTATION
  // ------------------------------------------------------
  x.save();
  x.translate(cx, cy);
  x.rotate(t);

  x.fillStyle = "#6cf";
  x.font = "bold 120px Consolas";
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.fillText("HH", 0, 0);

  x.restore();

  // ------------------------------------------------------
  // 2. ATOM‑ORBIT
  // ------------------------------------------------------
  atoms.forEach((atom, i)=>{
    const angle = t * (1 + atom.speed * 20);

    const ax = cx + Math.cos(angle + i) * atom.r;
    const ay = cy + Math.sin(angle + i) * atom.r;

    x.fillStyle = atom.color;
    x.beginPath();
    x.arc(ax, ay, 10, 0, Math.PI*2);
    x.fill();
  });

  // ------------------------------------------------------
  // 3. CENTER CORE
  // ------------------------------------------------------
  x.fillStyle = "#0f0";
  x.beginPath();
  x.arc(cx, cy, 8, 0, Math.PI*2);
  x.fill();

  t += 0.01;
  requestAnimationFrame(renderHH);
}

renderHH();
</script>

</body>
</html>
