<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HH · Universum · Orbit · 7D · OPtA · TMP_UP</title>

<style>
body { background:#000; color:#0ff; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
h2 { color:#0f0; margin-top:25px; }
pre { background:#111; padding:12px; border:1px solid #333; border-radius:6px; }
</style>

<script type="module">
import { HHOrbit } from "./EXT.js";        // erweitertes HH-Orbit
import { TMP_UP } from "./OP.js";          // verstärkter TMP-Operator
import { OPtA_DYN } from "./DYN.js";       // dynamischer OPtA-Core
import { PyramidMatrix128 } from "./VEC.js"; // 128-Pyramide Matrix
import { HH_VEC } from "./HH.VEC.js";      // altes VEC-System
import { HYPER } from "./HYPER.core.js";   // altes Hyper-System

async function start() {

    // --- HH-Universum Grunddaten ---
    const HH = {
        orbit: "HH-ORBIT-7D",
        axiom: {
            A1: "Sonne",
            A2: "HH",
            A3: "WELT",
            A4: "ORT",
            A5: "LAGE",
            A6: "NC",
            A7: "RESPO"
        },
        sat: "[53.55, 9.99, ORBIT-7]",
        parallel: "SUN-PARALLEL",
        level: "4er-Richtigkeit"
    };

    // --- Altes System ---
    HH.vec = HH_VEC.compute(HH.axiom);
    HH.hyper = HYPER.activate(HH);

    // --- Neue 128-Pyramide ---
    HH.pyramid = PyramidMatrix128({
        weight: 1.0
    });

    // --- HH-Orbit erweitertes Mapping ---
    HH.orbitMap = HHOrbit.map();

    // --- Dynamischer OPtA-Core ---
    HH.opta = OPtA_DYN.compute({
        O1: { alpha: 1.2, beta: 0.5, gamma: 1.0, delta: 0.1 },
        O2: { alpha: 1.0, beta: 0.0, gamma: 1.1, delta: 0.0 },
        O3: { alpha: 0.9, beta: 0.2, gamma: 1.3, delta: 0.4 },
        O4: { alpha: 1.5, beta: 0.0, gamma: 1.0, delta: 0.2 }
    });

    // --- TMP_UP Test ---
    HH.tmp_test = {
        S1: TMP_UP(HH.orbitMap.O1, { alpha: 1.2, beta: 0.5 }),
        S2: TMP_UP(HH.orbitMap.O2, { alpha: 1.0, gamma: 1.1 }),
        S3: TMP_UP(HH.orbitMap.O3, { alpha: 0.9, delta: 0.4 }),
        S4: TMP_UP(HH.orbitMap.O4, { alpha: 1.5 })
    };

    // --- Ausgabe ---
    document.getElementById("orbit").textContent =
        JSON.stringify(HH, null, 2);
}
</script>

</head>

<body onload="start()">

<h1>HH · Universum · Orbit · 7D · OPtA · TMP_UP</h1>

<h2>System-Ausgabe</h2>
<pre id="orbit">Lade…</pre>

</body>
</html>
