<script type="module">

/* ————————————————————————————————
   IMPORTS – ALLE MODULE AUS DEINEM REPO
——————————————————————————————— */
import { ORBIT_81_TMP } from "./81.tmp";
import { ORBIT_9x9 } from "./9×9.tmp";
import { TMP_RESPO } from "./RESPO.tmp";
import { iki1uc_KERNEL } from "./iki.js";

import { Pyramid128Mesh } from "./Three.js";
import { PyramidTensor128 } from "./Pyr.js";
import { HHOrbit_Pyramid } from "./Orb.js";
import { TMP } from "./TMP.js";

import VEC from "./VEC.tor";

/* ————————————————————————————————
   WebGL Setup
——————————————————————————————— */
function initGL() {
    const canvas = document.getElementById("hh3d");
    const gl = canvas.getContext("webgl");

    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    return gl;
}

/* ————————————————————————————————
   128‑Pyramide Render
——————————————————————————————— */
function renderPyramid(gl, mesh) {
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.vertices, gl.STATIC_DRAW);

    const vs = `
        attribute vec3 position;
        uniform float time;
        void main() {
            float wobble = sin(time) * 0.1;
            gl_Position = vec4(position.x + wobble, position.y, position.z, 1.0);
        }
    `;

    const fs = `
        precision mediump float;
        void main() {
            gl_FragColor = vec4(0.0, 1.0, 1.0, 1.0);
        }
    `;

    const vshader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vshader, vs);
    gl.compileShader(vshader);

    const fshader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fshader, fs);
    gl.compileShader(fshader);

    const program = gl.createProgram();
    gl.attachShader(program, vshader);
    gl.attachShader(program, fshader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const pos = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 0, 0);

    let t = 0;
    function loop() {
        t += 0.02;
        gl.uniform1f(gl.getUniformLocation(program, "time"), t);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, mesh.vertices.length / 3);
        requestAnimationFrame(loop);
    }
    loop();
}

/* ————————————————————————————————
   HH.respo – VEC.raw Integration
——————————————————————————————— */
const HHrespo = {
    name: "HH.respo",
    level: "semi-admin",
    active: true,

    status() {
        return {
            PX: VEC.PX.id,
            PQ: VEC.PQ.id,
            PR: VEC.PR.id,
            channel: VEC.channel,
            time: Date.now()
        };
    }
};

/* ————————————————————————————————
   START
——————————————————————————————— */
async function start() {

    const gl = initGL();

    /* 128‑Pyramide Render */
    renderPyramid(gl, Pyramid128Mesh);

    /* Tensor‑Modell */
    const tensor = PyramidTensor128.compute(Pyramid128Mesh);

    /* Orbit‑Mapping */
    const orbitMap = HHOrbit_Pyramid.map();

    /* iki1uc KI‑Kernel */
    const kernel = iki1uc_KERNEL.tick();

    /* HH.respo Status */
    const respoStatus = HHrespo.status();

    /* Ausgabe */
    const OUT = {
        orbitMap,
        tensor,
        kernel,
        respoStatus
    };

    document.getElementById("out").textContent =
        JSON.stringify(OUT, null, 2);
}
