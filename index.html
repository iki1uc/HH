<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HH · Wind‑Orbit‑Geo‑Runtime · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:30px; }
h1 { color:#0f0; margin-bottom:30px; }
.panel { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; border-radius:8px; }
.title { font-size:20px; color:#6cf; margin-bottom:10px; }
canvas { border:1px solid #0f0; margin-top:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:10px; white-space:pre-wrap; }
</style>

<script type="module">
/* HH MODULES */
import { HH_VEC } from "./HH.VEC.js";
import { HH_ORBIT } from "./HH.orbit.js";
import { HVGNH_CORE } from "./HVGNH-Core.js";
import { HYPER_CORE } from "./HYPER.core.js";
import { TMP } from "./TMP.js";

/* TEAM MODULES */
import { TEAM_BUILD } from "../TEAM/TE.js";
import { TEAM_DASHBOARD } from "../TEAM/TEAM_Dashboard.js";
import { TEAM_AI_CORE } from "../TEAM/TEAM_AI_Core.js";
import { TEAM_RUNTIME_MONITOR } from "../TEAM/TEAM_Runtime_Monitor.js";
import { TEAM_FUSION_SPHERE } from "../TEAM/TEAM_Fusion_Sphere.js";
import { TEAM_HUB_MATRIX } from "../TEAM/TEAM_HUB_Matrix.js";
import { TEAM_NC_QUANTUM_NODES } from "../TEAM/TEAM_NC_Quantum_Nodes.js";

/* iki1uc CORE */
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";
import { HUB_AI } from "../HUB/HUB_AI.js";
import { NET_OVERDRIVE } from "../NET/NET_Overdrive.js";

(async function(){

    /* iki1uc CORE INIT */
    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);
    const hub = HUB_AI(nc, pq, tmp);
    const net = NET_OVERDRIVE(nc, pq, tmp, hub);
    const respo = { mode:"active", signal:"bright" };

    /* TEAM BUILD */
    const team = TEAM_BUILD(hub, nc, pq, tmp, net, respo);

    /* HH WIND‑ORBIT‑GEO */
    const vec = HH_VEC();
    const orbit = HH_ORBIT();
    const hyper = HYPER_CORE();
    const geo = HVGNH_CORE();

    /* RENDER TEXT */
    document.getElementById("team-dashboard").innerText =
        JSON.stringify(TEAM_DASHBOARD(team), null, 2);

    document.getElementById("team-ai").innerText =
        JSON.stringify(TEAM_AI_CORE(team), null, 2);

    document.getElementById("team-runtime").innerText =
        JSON.stringify(TEAM_RUNTIME_MONITOR(team), null, 2);

    document.getElementById("team-fusion").innerText =
        JSON.stringify(TEAM_FUSION_SPHERE(team), null, 2);

    document.getElementById("team-hub").innerText =
        JSON.stringify(TEAM_HUB_MATRIX(team), null, 2);

    document.getElementById("team-nc").innerText =
        JSON.stringify(TEAM_NC_QUANTUM_NODES(team), null, 2);

    /* WIND‑ORBIT‑GEO CANVAS */
    const c = document.getElementById("wind");
    const ctx = c.getContext("2d");

    function renderWind(){
        ctx.clearRect(0,0,600,200);

        // Wind Vector
        ctx.strokeStyle="#0f0";
        ctx.beginPath();
        ctx.moveTo(20,100);
        ctx.lineTo(20 + vec.speed*4, 100);
        ctx.stroke();

        // Orbit
        ctx.strokeStyle="#6cf";
        ctx.beginPath();
        ctx.arc(300,100, orbit.radius, 0, Math.PI*2);
        ctx.stroke();

        // Hyper Pulse
        ctx.fillStyle="#f0f";
        ctx.fillRect(20,180, hyper.pulse/2, 5);

        // Geo Node
        ctx.fillStyle="#ff0";
        ctx.fillRect(500, 80, 20, 20);
    }

    setInterval(renderWind, 120);

})();
</script>

    <pre id="team-hub">
